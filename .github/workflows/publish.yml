name: publish

on:
  push:
    branches: [main]
    paths:
      - counties/**
  workflow_dispatch:
    inputs:
      gateway_deadline_minutes:
        description: Minutes to keep retrying a gateway export before calling the content unavailable (default 20)
        required: false
      county:
        description: Transfer every root of this county on main again, e.g. TX/travis (idempotent); other counties' pending publications are published as usual
        required: false
      transfer_all:
        description: Transfer every root on main again (idempotent), not only the ones index.json lacks
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# One run at a time. Merges can land faster than runs finish, and GitHub keeps only the newest
# waiting run, so a run never assumes it is the only one owed: it takes main as it is when it
# starts and transfers every root index.json does not list yet (see transfer-roots.mjs). That
# holds for a dispatched run too, whatever its inputs: it may be the one that replaced another.
# What a run leaves owed (a group deferred, an index step that failed) is picked up by the next
# one; publish-retry.yml starts it when no merge does. It is a workflow of its own because a
# schedule here would queue a run every few hours and so replace a waiting dispatch.
concurrency: publish

env:
  FILEBASE_ACCESS_KEY: ${{ secrets.ELEPHANT_FILEBASE_ACCESS_KEY }}
  FILEBASE_SECRET_KEY: ${{ secrets.ELEPHANT_FILEBASE_SECRET_KEY }}
  FILEBASE_BUCKET: elephant-atlas
  # Filebase's S3 endpoint, for the import=car uploads (same keys as the RPC; SigV4).
  FILEBASE_S3_ENDPOINT: ${{ vars.FILEBASE_S3_ENDPOINT || 'https://s3.filebase.com' }}
  # Optional private gateway(s), comma-separated, tried before the public ones; masked in logs.
  ATLAS_GATEWAYS: ${{ secrets.ATLAS_GATEWAYS }}
  ATLAS_GATEWAY_TOKEN: ${{ secrets.ATLAS_GATEWAY_TOKEN }}
  # A transfer from a `car` file indexes the whole CAR (about 2.3 GB of heap for 11M blocks).
  NODE_OPTIONS: --max-old-space-size=12288
  # Shards imported at once. 32 overloaded the Filebase RPC on Travis (connection resets, HTTP 500).
  ATLAS_TRANSFER_PARALLEL: ${{ vars.ATLAS_TRANSFER_PARALLEL || '8' }}
  ATLAS_IPNS_KEY: elephant-atlas
  ATLAS_IPNS_ID: k51qzi5uqu5dhzmj1jtn06idud425ozwdjjjn4eu7q01g2t814h7rw4du0nd04
  # Dispatch input, else the repository variable (set it to shorten a test), else 20 minutes.
  ATLAS_GATEWAY_DEADLINE_MINUTES: ${{ inputs.gateway_deadline_minutes || vars.ATLAS_GATEWAY_DEADLINE_MINUTES || '20' }}

jobs:
  # 1. List the groups main holds with roots index.json does not list yet (a git read; it calls
  # neither the gateways nor Filebase). Publication is a merge whose archive already passed validation; nothing here
  # validates archives again. It does refuse a root that two merged pull requests both claim.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # `ref` is given explicitly so the checkout is the branch as it is when the run starts, not
      # the commit that triggered it: a run that waited behind another one must see what that run
      # did (a withdrawal, a new index). On a push or a retry that is main. A dispatch from another
      # branch runs that branch's transfer jobs with its own workflow file, which is how a change
      # to the transfer is tried before it merges, and stops there: the index and the withdrawal
      # run on main only (and publish-index refuses an index that is not main's). Every job of the
      # run checks out this same commit (`sha`), so the plan and the transfers agree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # main's history: the order groups claimed their roots in
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        env:
          COUNTY: ${{ inputs.county }}
        run: node scripts/transfer-roots.mjs --plan ${{ inputs.transfer_all && '--all' || '' }} ${COUNTY:+--county "$COUNTY"}

  # 2. One job per group: for each of its roots (archive, then tables) build one CAR file of the
  # root's DAG (the group's `car` file as it is, or the shards / Parquet parts exported from the
  # gateways), upload it to the elephant-atlas bucket through Filebase's S3 endpoint with the
  # metadata import=car, which makes Filebase import it and pin the root, and require pin/ls to
  # list the root (ATLAS_PIN_VIA=rpc goes back to dag/import shard by shard and part by part,
  # then a pinned import of the root block). A job has the whole 6-hour job limit to itself, and the jobs run
  # side by side, up to ATLAS_PUBLISH_MAX_PARALLEL at once (repository variable, default 4; each
  # job imports ATLAS_TRANSFER_PARALLEL shards at a time, so the product is the load on the
  # Filebase RPC). A group that fails is held back and the job ends red; the others go on.
  # When the gateways or Filebase are down nothing is blamed on a publication (exit 2 when they
  # are down from the start). Each root is copied in a process of its own within the job's time
  # budget, so an archive that exhausts the heap or hangs costs only itself.
  # A job that runs out of time is cheap to repeat: a pinned root is skipped at once, and the
  # shards Filebase confirmed are kept in the Actions cache (ATLAS_PROGRESS_DIR) and not sent again.
  transfer:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    name: transfer ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.ATLAS_PUBLISH_MAX_PARALLEL || '4') }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # The root copies stop after this, leaving time for the cache and the hold to be saved
      # inside the 360-minute job limit (setup and the CAR download fit in the rest).
      ATLAS_RUN_MINUTES: ${{ vars.ATLAS_RUN_MINUTES || '330' }}
      ATLAS_ROOT_MINUTES: ${{ vars.ATLAS_ROOT_MINUTES || '330' }}
      # How long to watch pin/ls for a pin after the pinned import ends at Filebase's proxy; the
      # root's own time limit stops it earlier.
      ATLAS_PIN_MINUTES: ${{ vars.ATLAS_PIN_MINUTES || '330' }}
      # Opt-in: also skip shards block/get finds. It answers for blocks on the IPFS network too,
      # so on a first transfer it can skip shards the bucket lacks (the pin then fails and the
      # root is deferred, not withdrawn). The progress cache below is the default resume.
      ATLAS_SKIP_STORED_SHARDS: ${{ vars.ATLAS_SKIP_STORED_SHARDS || '0' }}
      # s3 (default): upload each root as one import=car object; rpc: the dag/import path.
      ATLAS_PIN_VIA: ${{ vars.ATLAS_PIN_VIA || 's3' }}
      # full (default): the tables CAR carries the archive's blocks too. Filebase pins a root only
      # from a CAR that holds every block reachable from it (Filebase support, 2026-11-13); it does
      # not combine the upload with the archive already pinned in the bucket. parts: send the tables
      # block and its Parquet parts alone first, wait ATLAS_TABLES_PIN_MINUTES, then send the full one.
      ATLAS_TABLES_PIN_MINUTES: ${{ vars.ATLAS_TABLES_PIN_MINUTES || '30' }}
      ATLAS_TABLES_CAR: ${{ vars.ATLAS_TABLES_CAR || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0 # main's history for the plan this job repeats
          persist-credentials: false
      - name: Mask the Filebase token
        run: echo "::add-mask::$(printf '%s:%s:%s' "$FILEBASE_ACCESS_KEY" "$FILEBASE_SECRET_KEY" "$FILEBASE_BUCKET" | base64 -w0)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The shards an earlier run confirmed for this group's first root (a new key per run, the
      # newest earlier one restored).
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-progress
          key: atlas-progress-${{ matrix.first }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: atlas-progress-${{ matrix.first }}-
      - id: transfer
        env:
          COUNTY: ${{ inputs.county }}
          GROUP: ${{ matrix.group }}
          ATLAS_PROGRESS_DIR: ${{ runner.temp }}/atlas-progress
          ATLAS_HELD: ${{ runner.temp }}/held/${{ strategy.job-index }}.json
        run: |
          mkdir -p "$(dirname "$ATLAS_HELD")" "$ATLAS_PROGRESS_DIR"
          node scripts/transfer-roots.mjs --group "$GROUP" ${{ inputs.transfer_all && '--all' || '' }} ${COUNTY:+--county "$COUNTY"}
      - if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/atlas-progress
          key: atlas-progress-${{ matrix.first }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: held-${{ strategy.job-index }}
          path: ${{ runner.temp }}/held/
          if-no-files-found: ignore
          retention-days: 7

  # 3-4. Once every transfer job has ended, whatever they ended as (also when the plan found
  # nothing to transfer, or a job crashed or ran out of time): it asks Filebase what is pinned, so
  # the counties that did arrive are published and nothing else is.
  publish:
    needs: [plan, transfer]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      index_cid: ${{ steps.index.outputs.cid }}
    steps:
      # main is protected by a ruleset that GITHUB_TOKEN cannot bypass; the bot commits (index.json,
      # withdrawals) go through the write deploy key registered as a bypass actor, so the checkout's
      # origin is SSH and every `git push origin HEAD:main` below uses it. The plan's commit, so
      # the index and the withdrawals are judged on what was transferred.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0 # main's history for published_at and for a group's last published version
          ssh-key: ${{ secrets.ATLAS_DEPLOY_KEY }}
      - name: Mask the Filebase token
        run: echo "::add-mask::$(printf '%s:%s:%s' "$FILEBASE_ACCESS_KEY" "$FILEBASE_SECRET_KEY" "$FILEBASE_BUCKET" | base64 -w0)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Commit as the actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Collect what the transfer jobs held back and settle it as one run would have: a run takes
      # at most one publication off main for failing to transfer (several failing together may be
      # the network), and groups that claim the same root are settled in merge order.
      - if: ${{ needs.transfer.result != 'skipped' }}
        uses: actions/download-artifact@v4
        continue-on-error: true # no job left a hold
        with:
          pattern: held-*
          path: ${{ runner.temp }}/held
          merge-multiple: true
      - id: settle
        env:
          COUNTY: ${{ inputs.county }}
          ATLAS_HELD: ${{ runner.temp }}/held.json
        run: node scripts/transfer-roots.mjs --settle "$RUNNER_TEMP/held" ${{ inputs.transfer_all && '--all' || '' }} ${COUNTY:+--county "$COUNTY"}

      # 3. Regenerate index.json from every group whose roots Filebase lists as pinned, commit it
      # if it changed (pushed through the deploy key, rebased first when main moved during the
      # run; the commit touches only index.json, outside this workflow's path filter, so it does
      # not retrigger), add it to the bucket, point the IPNS name at it, and require the gateway
      # to serve the committed bytes. It ends red when a group on main was left out, after
      # publishing the rest. A failure here is not a withdrawal; re-run the workflow
      # (workflow_dispatch) and it finishes idempotently.
      - id: index
        env:
          GH_TOKEN: ${{ github.token }} # a `Publication pending` issue for a group left out too long
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/publish-index.mjs

      # 4. A root the gateway cannot serve, or one another group holds, is not publishable: take
      # that group off main (back to what was last published; see withdraw.mjs) and open an
      # issue. Groups that failed for another reason stay on main and the next run tries them
      # again. Only once the index step has main's index in place (it sets `indexed`, whatever
      # the IPNS name and the gateway do afterwards, and also when it ends red over groups it
      # left out): the withdrawal carries [skip ci], and a group the index listed after all is
      # not withdrawn. When the index step failed before that, the next run does both.
      - name: Withdraw what could not be published
        if: ${{ !cancelled() && steps.index.outputs.indexed == 'true' && steps.settle.outputs.withdrawn != '' && steps.settle.outputs.withdrawn != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATLAS_HELD: ${{ runner.temp }}/held.json
        run: node scripts/withdraw.mjs

  # 5. Optional: copy the published index.json to S3 for consumers that read it from a bucket
  # (Persist's registered IPFS indexes). Off unless the ATLAS_INDEX_S3_URI repository variable is
  # set. It runs only after the IPNS name serves the new index, in its own job so the OIDC token
  # (id-token: write) and the role it assumes never reach the transfer or the deploy key. It
  # uploads main's index.json only when its UnixFS CID is the one publish-index published, so
  # the object is those exact bytes. A failure here leaves the IPFS publication as it is (the
  # run shows red); re-run the failed job, or the whole workflow, and it puts the same bytes.
  index-s3:
    needs: publish
    # Whenever publish-index published an index (it then sets the CID), also when the publish job
    # ends red over a group it could not publish: the index it did publish is what S3 must hold.
    if: ${{ !cancelled() && needs.publish.outputs.index_cid != '' && vars.ATLAS_INDEX_S3_URI != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # This job talks to S3 only; keep the workflow's Filebase credentials out of it.
      FILEBASE_ACCESS_KEY: ''
      FILEBASE_SECRET_KEY: ''
      ATLAS_GATEWAYS: ''
      ATLAS_GATEWAY_TOKEN: ''
      ATLAS_INDEX_S3_URI: ${{ vars.ATLAS_INDEX_S3_URI }}
      ATLAS_INDEX_CID: ${{ needs.publish.outputs.index_cid }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # where publish-index committed the index (or left it unchanged)
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ATLAS_INDEX_S3_ROLE_ARN }}
          aws-region: ${{ vars.ATLAS_INDEX_S3_REGION || 'us-east-1' }}
          role-session-name: atlas-index-s3-${{ github.run_id }}
      - run: node scripts/upload-index-s3.mjs index.json
