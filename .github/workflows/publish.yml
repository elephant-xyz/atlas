name: publish

on:
  push:
    branches: [main]
    paths:
      - counties/**
  workflow_dispatch:
    inputs:
      gateway_deadline_minutes:
        description: Minutes to keep retrying a gateway export before calling the content unavailable (default 20)
        required: false
      county:
        description: Transfer only this county's roots on main, e.g. TX/travis (idempotent)
        required: false
      transfer_all:
        description: Transfer every root on main again (idempotent), not only the ones this push added
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: publish

env:
  FILEBASE_ACCESS_KEY: ${{ secrets.ELEPHANT_FILEBASE_ACCESS_KEY }}
  FILEBASE_SECRET_KEY: ${{ secrets.ELEPHANT_FILEBASE_SECRET_KEY }}
  FILEBASE_BUCKET: elephant-atlas
  # Optional private gateway(s), comma-separated, tried before the public ones; masked in logs.
  ATLAS_GATEWAYS: ${{ secrets.ATLAS_GATEWAYS }}
  ATLAS_GATEWAY_TOKEN: ${{ secrets.ATLAS_GATEWAY_TOKEN }}
  # A transfer from a `car` file indexes the whole CAR (about 2.3 GB of heap for 11M blocks).
  NODE_OPTIONS: --max-old-space-size=12288
  # Shards imported at once. 32 overloaded the Filebase RPC on Travis (connection resets, HTTP 500).
  ATLAS_TRANSFER_PARALLEL: ${{ vars.ATLAS_TRANSFER_PARALLEL || '8' }}
  ATLAS_IPNS_KEY: elephant-atlas
  ATLAS_IPNS_ID: k51qzi5uqu5dhzmj1jtn06idud425ozwdjjjn4eu7q01g2t814h7rw4du0nd04
  # Dispatch input, else the repository variable (set it to shorten a test), else 20 minutes.
  ATLAS_GATEWAY_DEADLINE_MINUTES: ${{ inputs.gateway_deadline_minutes || vars.ATLAS_GATEWAY_DEADLINE_MINUTES || '20' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      index_cid: ${{ steps.index.outputs.cid }}
    steps:
      # main is protected by a ruleset that GITHUB_TOKEN cannot bypass; the bot commits (index.json,
      # reverts) go through the write deploy key registered as a bypass actor, so the checkout's
      # origin is SSH and every `git push origin HEAD:main` below uses it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD~1 for the root diff, main's history for published_at
          ssh-key: ${{ secrets.ATLAS_DEPLOY_KEY }}
      - name: Mask the Filebase token
        run: echo "::add-mask::$(printf '%s:%s:%s' "$FILEBASE_ACCESS_KEY" "$FILEBASE_SECRET_KEY" "$FILEBASE_BUCKET" | base64 -w0)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Commit as the actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Publication is a merge that already passed validation; this job never validates.
      # 1-2. Export every root this push published from the public gateway and import it into
      # the elephant-atlas bucket, shard by shard and part by part, then pin the root.
      - id: transfer
        env:
          COUNTY: ${{ inputs.county }}
        run: node scripts/transfer-roots.mjs ${{ inputs.transfer_all && '--all' || '' }} ${COUNTY:+--county "$COUNTY"}

      # 3. A root the gateway cannot serve is not publishable: revert the push. A deploy-key push
      # does trigger workflows, and the revert touches counties/**, so its message carries
      # [skip ci] to keep it from retriggering this job. index.json and the IPNS name are
      # untouched on this path. Other failures (credentials, RPC) set no failed_root and are not
      # reverted; re-run the workflow.
      - name: Revert the publication
        if: failure() && steps.transfer.outputs.failed_root != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_ROOT: ${{ steps.transfer.outputs.failed_root }}
          FAILED_REASON: ${{ steps.transfer.outputs.failed_reason }}
          COUNTY: ${{ steps.transfer.outputs.county }}
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then git revert --no-edit -m 1 HEAD; else git revert --no-edit HEAD; fi
          git commit --amend --no-edit -m "$(git log -1 --format=%B) [skip ci]"
          git push origin HEAD:main
          REVERT=$(git rev-parse HEAD)
          gh issue create \
            --title "Publication reverted: $COUNTY $FAILED_ROOT" \
            --body "$(printf 'The publish workflow could not transfer `%s` into the `elephant-atlas` bucket.\n\n- reason: %s\n- reverted in %s\n- run: %s\n\nRe-upload the archive, confirm a public gateway serves it, then open a new pull request.' \
              "$FAILED_ROOT" "$FAILED_REASON" "$REVERT" "$RUN_URL")"
          echo "Reverted ${{ github.sha }} in $REVERT" >> "$GITHUB_STEP_SUMMARY"

      # 4. Regenerate index.json, commit it if it changed (pushed through the deploy key; the
      # commit touches only index.json, outside this workflow's path filter, so it does not
      # retrigger), add it to the bucket, point the IPNS name at it, and require the gateway to
      # serve the committed bytes. A failure here is not a revert; re-run the workflow
      # (workflow_dispatch) and it finishes idempotently.
      - id: index
        run: node scripts/publish-index.mjs

  # 5. Optional: copy the published index.json to S3 for consumers that read it from a bucket
  # (Persist's registered IPFS indexes). Off unless the ATLAS_INDEX_S3_URI repository variable is
  # set. It runs only after the IPNS name serves the new index, in its own job so the OIDC token
  # (id-token: write) and the role it assumes never reach the transfer or the deploy key. It
  # uploads main's index.json only when its UnixFS CID is the one publish-index published, so
  # the object is those exact bytes. A failure here leaves the IPFS publication as it is (the
  # run shows red); re-run the failed job, or the whole workflow, and it puts the same bytes.
  index-s3:
    needs: publish
    if: vars.ATLAS_INDEX_S3_URI != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # This job talks to S3 only; keep the workflow's Filebase credentials out of it.
      FILEBASE_ACCESS_KEY: ''
      FILEBASE_SECRET_KEY: ''
      ATLAS_GATEWAYS: ''
      ATLAS_GATEWAY_TOKEN: ''
      ATLAS_INDEX_S3_URI: ${{ vars.ATLAS_INDEX_S3_URI }}
      ATLAS_INDEX_CID: ${{ needs.publish.outputs.index_cid }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # where publish-index committed the index (or left it unchanged)
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ATLAS_INDEX_S3_ROLE_ARN }}
          aws-region: ${{ vars.ATLAS_INDEX_S3_REGION || 'us-east-1' }}
          role-session-name: atlas-index-s3-${{ github.run_id }}
      - run: node scripts/upload-index-s3.mjs index.json
