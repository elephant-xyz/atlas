name: validate

on:
  pull_request:
    paths:
      - counties/**
      - schema/**
      - scripts/**
      - tests/**
      - index.json
      - package.json
      - package-lock.json
      - .github/workflows/validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/main is the baseline for "new root" and for the index check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      # Root and spot checks first: they fail fast on an unserved or malformed root.
      - run: npm run verify
      - run: npm run index -- --check

      # Full validation of every archive this pull request adds, with the Elephant CLI from
      # GitHub main (cached per main commit).
      - name: Resolve elephant-cli main
        id: cli
        run: echo "sha=$(git ls-remote https://github.com/elephant-xyz/elephant-cli.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cli-cache
        with:
          path: ~/elephant-cli
          key: elephant-cli-${{ steps.cli.outputs.sha }}
      - if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/elephant-cli && cd ~/elephant-cli
          npm init -y >/dev/null
          npm i --no-audit --no-fund "github:elephant-xyz/elephant-cli#${{ steps.cli.outputs.sha }}"
      - name: Validate every new archive in full
        env:
          ELEPHANT_CLI: /home/runner/elephant-cli/node_modules/.bin/elephant-cli
          ATLAS_VALIDATION_CSV: ${{ runner.temp }}/validation-errors.csv
        run: node scripts/validate-archives.mjs
      - name: Upload validation errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-errors
          path: ${{ runner.temp }}/validation-errors.csv
          if-no-files-found: ignore
