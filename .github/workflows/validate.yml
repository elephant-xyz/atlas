name: validate

on:
  # Every pull request: the ruleset on main requires this check, so a PR that
  # touches only docs or workflows must still report it (the scripts no-op).
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/main is the baseline for "changed group" and for the index.json check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate

      # Every changed group: the whole archive downloaded by root and validated with the Elephant
      # CLI, then schema, tables and every part by CID. Nothing is resolved by path.
      # The CLI is version 2 (one binary, no Node), pinned to one release and to the digest of its
      # archive, so a new CLI reaches this gate only through a pull request here.
      - name: Install elephant-cli
        env:
          VERSION: v2.0.0-alpha.0
          SHA256: 94cff190683dcee4b5307aaeaa0a3392cd83748335e6110cf501838b7a063f1b
        run: |
          mkdir -p ~/elephant-cli && cd ~/elephant-cli
          curl -fsSL --retry 3 -o cli.tar.gz "https://github.com/elephant-xyz/elephant-cli/releases/download/$VERSION/elephant-cli-x86_64-unknown-linux-gnu.tar.gz"
          echo "$SHA256  cli.tar.gz" | sha256sum -c -
          tar -xzf cli.tar.gz
          ./elephant-cli --version
      - name: Verify every changed group
        env:
          ELEPHANT_CLI: /home/runner/elephant-cli/elephant-cli
          ATLAS_VALIDATION_CSV: ${{ runner.temp }}/validation-errors.csv
          # Optional private gateway(s) for archive downloads, and the token a restricted Filebase
          # dedicated gateway requires (sent only to ATLAS_GATEWAYS); masked in logs. Pull requests
          # from forks get no secrets and use the public gateways only. The CLI fetches its small
          # lexicon schemas from its own public defaults: it cannot send the gateway token, and
          # ELEPHANT_IPFS_GATEWAYS would replace those defaults with a gateway that refuses it.
          ATLAS_GATEWAYS: ${{ secrets.ATLAS_GATEWAYS }}
          ATLAS_GATEWAY_TOKEN: ${{ secrets.ATLAS_GATEWAY_TOKEN }}
          # Same as publish.yml: the per-request retry window, from the repository variable.
          ATLAS_GATEWAY_DEADLINE_MINUTES: ${{ vars.ATLAS_GATEWAY_DEADLINE_MINUTES || '20' }}
          # For the verify script itself, which indexes the CAR after the CLI has checked it
          # (scripts/car-file.mjs): a full-county CAR has 11M blocks (Travis).
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run verify
      # TEMPORARY, reverted before merge: this pull request changes no group, so the step above
      # verifies nothing. Verify both Travis County groups once, the largest published archive,
      # with the CLI's time and peak memory in the log.
      - name: One-off, verify Travis County with this CLI
        env:
          ELEPHANT_CLI: ${{ runner.temp }}/timed-cli
          ATLAS_VALIDATION_CSV: ${{ runner.temp }}/validation-errors.csv
          ATLAS_GATEWAYS: ${{ secrets.ATLAS_GATEWAYS }}
          ATLAS_GATEWAY_TOKEN: ${{ secrets.ATLAS_GATEWAY_TOKEN }}
          ATLAS_GATEWAY_DEADLINE_MINUTES: ${{ vars.ATLAS_GATEWAY_DEADLINE_MINUTES || '20' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          printf '#!/bin/sh\nexec /usr/bin/time -v /home/runner/elephant-cli/elephant-cli "$@"\n' > "$ELEPHANT_CLI"
          chmod +x "$ELEPHANT_CLI"
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          import { verifyGroup } from './scripts/verify-roots.mjs';
          const page = JSON.parse(readFileSync('counties/TX/travis.json', 'utf8'));
          for (const key of Object.keys(page.groups)) {
            console.log('verifying travis group ' + key);
            await verifyGroup(page.groups[key]);
            console.log('ok travis group ' + key);
          }
          "
      - name: Upload validation errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-errors
          path: ${{ runner.temp }}/validation-errors.csv
          if-no-files-found: ignore
