name: validate

on:
  # Every pull request: the ruleset on main requires this check, so a PR that
  # touches only docs or workflows must still report it (the scripts no-op).
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/main is the baseline for "changed group" and for the index.json check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate

      # Every changed group: the whole archive downloaded by root and validated with the Elephant
      # CLI from GitHub main (cached per main commit), then schema, tables and every part by CID.
      # Nothing is resolved by path.
      - name: Resolve elephant-cli main
        id: cli
        run: echo "sha=$(git ls-remote https://github.com/elephant-xyz/elephant-cli.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cli-cache
        with:
          path: ~/elephant-cli
          key: elephant-cli-${{ steps.cli.outputs.sha }}
      - if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/elephant-cli && cd ~/elephant-cli
          npm init -y >/dev/null
          npm i --no-audit --no-fund "github:elephant-xyz/elephant-cli#${{ steps.cli.outputs.sha }}"
      # elephant-cli validate indexes the whole CAR with @ipld/car, which runs out of a 12 GB heap
      # on Node 22 and 24 for an archive of 11M blocks (Travis County) and takes 2.6 GB on Node 26.
      # The CLI's git install does not build on Node 26, so it is installed above on Node 22 and
      # run on Node 26.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify every changed group
        env:
          ELEPHANT_CLI: /home/runner/elephant-cli/node_modules/.bin/elephant-cli
          ATLAS_VALIDATION_CSV: ${{ runner.temp }}/validation-errors.csv
          # Optional private gateway(s) for archive downloads, and the token a restricted Filebase
          # dedicated gateway requires (sent only to ATLAS_GATEWAYS); masked in logs. Pull requests
          # from forks get no secrets and use the public gateways only. The CLI fetches its small
          # lexicon schemas from its own public defaults: it cannot send the gateway token, and
          # ELEPHANT_IPFS_GATEWAYS would replace those defaults with a gateway that refuses it.
          ATLAS_GATEWAYS: ${{ secrets.ATLAS_GATEWAYS }}
          ATLAS_GATEWAY_TOKEN: ${{ secrets.ATLAS_GATEWAY_TOKEN }}
          # Same as publish.yml: the per-request retry window, from the repository variable.
          ATLAS_GATEWAY_DEADLINE_MINUTES: ${{ vars.ATLAS_GATEWAY_DEADLINE_MINUTES || '20' }}
          # Indexing a full-county CAR (11M blocks for Travis) takes about 2.3 GB of heap.
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run verify
      - name: Upload validation errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-errors
          path: ${{ runner.temp }}/validation-errors.csv
          if-no-files-found: ignore
